<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/tp.css"><title>FUTURA — Geometría analítica</title></head><body><script src="/static/tp.js"></script><script>
const N = TP.num, sg = TP.sg;
TP.lab({
  icon: '🧭', title: 'Laboratorio: Distancia y punto medio', alt: 'Dos puntos en el plano con su distancia y su punto medio',
  subtitle: 'Mueve los puntos <b>A</b> y <b>B</b> y observa la distancia, el punto medio y la pendiente.',
  controls: [{ id: 'x1', label: 'Punto A: <b>x₁</b>', min: -9, max: 9, step: 1, value: -2, dec: 0 }, { id: 'y1', label: 'Punto A: <b>y₁</b>', min: -7, max: 7, step: 1, value: 1, dec: 0 }, { id: 'x2', label: 'Punto B: <b>x₂</b>', min: -9, max: 9, step: 1, value: 3, dec: 0 }, { id: 'y2', label: 'Punto B: <b>y₂</b>', min: -7, max: 7, step: 1, value: 4, dec: 0 }],
  presets: [{ label: 'Triángulo 3-4-5', values: { x1: 0, y1: 0, x2: 3, y2: 4 } }, { label: 'Segmento horizontal', values: { x1: -3, y1: 2, x2: 3, y2: 2 } }, { label: 'Simétricos al origen', values: { x1: -4, y1: -3, x2: 4, y2: 3 } }],
  compute({ x1, y1, x2, y2 }) {
    const dx = x2 - x1, dy = y2 - y1, d2 = dx * dx + dy * dy, d = Math.sqrt(d2), mx = (x1 + x2) / 2, my = (y1 + y2) / 2, m = dx !== 0 ? dy / dx : null, b = m !== null ? y1 - m * x1 : null;
    return { x1, y1, x2, y2, d, mx, my, dx, dy, steps: [
      { t: 'PASO 1 : Los puntos', html: `A(${x1}, ${y1}) · B(${x2}, ${y2})` },
      { t: 'PASO 2 : Diferencias', html: `Δx = ${x2} − (${x1}) = ${dx}<br>Δy = ${y2} − (${y1}) = ${dy}` },
      { t: 'PASO 3 : Distancia (Pitágoras)', html: `d = √(Δx² + Δy²) = √(${dx * dx} + ${dy * dy}) = √${d2}`, r: d === 0 ? '0 (mismo punto)' : (Number.isInteger(d) ? String(d) : '≈ ' + N(d, 3)), cls: 'good' },
      { t: 'PASO 4 : Punto medio', html: `M = ((x₁ + x₂)/2 , (y₁ + y₂)/2) = ((${x1} + ${x2})/2 , (${y1} + ${y2})/2)`, r: `(${N(mx)}, ${N(my)})` },
      { t: 'PASO 5 : Pendiente', html: m !== null ? `m = Δy / Δx = ${dy} / ${dx}` : 'La recta es vertical: la pendiente no está definida.', r: m !== null ? N(m) : '' },
      { t: 'PASO 6 : Ecuación de la recta', html: m !== null ? `y = ${N(m)}x ${sg(b)}` : `x = ${x1}` }] };
  },
  draw(ctx, S, res, { W, H }) {
    const g = TP.plane(ctx, W, H, { x0: -11, x1: 11, y0: -9, y1: 9, xt: 2, yt: 2 }), { x1, y1, x2, y2 } = S;
    TP.line(ctx, g.X(x1), g.Y(y1), g.X(x2), g.Y(y1), 'rgba(167,139,250,.8)', 2, [5, 4]); TP.line(ctx, g.X(x2), g.Y(y1), g.X(x2), g.Y(y2), 'rgba(167,139,250,.8)', 2, [5, 4]);
    TP.line(ctx, g.X(x1), g.Y(y1), g.X(x2), g.Y(y2), '#38bdf8', 3);
    TP.dot(ctx, g.X(x1), g.Y(y1), 7, '#f472b6'); TP.dot(ctx, g.X(x2), g.Y(y2), 7, '#f472b6'); TP.dot(ctx, g.X(res.mx), g.Y(res.my), 6, '#f59e0b');
    TP.tx(ctx, `A(${x1}, ${y1})`, g.X(x1) - 8, g.Y(y1) - 10, '#f472b6', 'right'); TP.tx(ctx, `B(${x2}, ${y2})`, g.X(x2) + 8, g.Y(y2) - 10, '#f472b6', 'left'); TP.tx(ctx, `M(${N(res.mx)}, ${N(res.my)})`, g.X(res.mx) + 10, g.Y(res.my) + 18, '#f59e0b', 'left');
    TP.tx(ctx, `d = ${N(res.d, 2)}`, g.l + 8, g.t + 14, '#38bdf8', 'left');
  },
  retos: [
    { text: 'Consigue una distancia de <b>exactamente 5</b> entre A y B.', check: (S, r) => Math.abs(r.d - 5) < 1e-9 },
    { text: 'Haz que el punto medio sea el <b>origen (0, 0)</b> con A y B distintos.', check: (S, r) => r.d > 0 && r.mx === 0 && r.my === 0 },
    { text: 'Consigue un segmento <b>horizontal</b> de longitud <b>6</b>.', check: S => S.y1 === S.y2 && Math.abs(S.x1 - S.x2) === 6 }],
  info: [
    { cls: 'materials', title: '📘 LAS FÓRMULAS', html: '<p><b>Distancia:</b> d = √[(x₂ − x₁)² + (y₂ − y₁)²].</p><p><b>Punto medio:</b> promedio de las coordenadas.</p><p><b>Pendiente:</b> m = (y₂ − y₁) / (x₂ − x₁).</p>' },
    { cls: 'explanation', title: '💡 ¿POR QUÉ ES IMPORTANTE?', html: '<p>Los mapas, los GPS y los videojuegos calculan distancias entre coordenadas todo el tiempo.</p><div class="highlight"><b>Regla de oro:</b> la distancia en línea recta es la hipotenusa de un triángulo rectángulo cuyos catetos son Δx y Δy.</div>' }]
});
</script></body></html>

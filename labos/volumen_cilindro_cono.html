<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/tp.css"><title>FUTURA — Volumen</title></head><body><script src="/static/tp.js"></script><script>
const N = TP.num;
TP.lab({
  icon: '🥫', title: 'Laboratorio: Volumen del cilindro y del cono', alt: 'Un cilindro y un cono con el mismo radio y la misma altura',
  subtitle: '<b>V = π r² h</b> (cilindro) y <b>V = ⅓ π r² h</b> (cono) · Unidades en cm.',
  controls: [{ id: 'r', label: 'Radio <b>r</b>', min: 1, max: 10, step: 0.5, value: 3, unit: ' cm' }, { id: 'h', label: 'Altura <b>h</b>', min: 1, max: 15, step: 0.5, value: 6, unit: ' cm' }],
  presets: [{ label: 'Lata (r 3.5, h 12)', values: { r: 3.5, h: 12 } }, { label: 'Radio ×2 (r 6, h 6)', values: { r: 6, h: 6 } }, { label: 'Casi 1 litro', values: { r: 5, h: 13 } }],
  compute({ r, h }) {
    const A = Math.PI * r * r, Vc = A * h, Vk = Vc / 3;
    return { Vc, Vk, steps: [
      { t: 'PASO 1 : Datos', html: `r = ${N(r)} cm · h = ${N(h)} cm` },
      { t: 'PASO 2 : Área de la base  A = π r²', html: `A = π × ${N(r)}² = π × ${N(r * r)}`, r: `${N(A)} cm²` },
      { t: 'PASO 3 : Cilindro  V = A × h', html: `V = ${N(A)} × ${N(h)}`, r: `${N(Vc)} cm³`, cls: 'good' },
      { t: 'PASO 4 : Cono  V = ⅓ × A × h', html: `V = ${N(Vc)} / 3`, r: `${N(Vk)} cm³` },
      { t: 'PASO 5 : Relación', html: `Cilindro / cono = ${N(Vc)} / ${N(Vk)}`, f: `= ${N(Vc / Vk, 1)}  → 3 conos llenan 1 cilindro` },
      { t: 'PASO 6 : Capacidad (1 litro = 1000 cm³)', html: `${N(Vc)} / 1000`, r: `${N(Vc / 1000, 3)} litros` }] };
  },
  draw(ctx, { r, h }, res, { W, H }) {
    ctx.fillStyle = 'rgba(10,14,39,.6)'; ctx.fillRect(0, 0, W, H);
    const u = 10, by = 335, R = r * u, ry = R * 0.3, top = by - h * u;
    const shape = (cx, cone, col) => { ctx.fillStyle = col + '40'; ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath();
      if (cone) { ctx.moveTo(cx, top); ctx.lineTo(cx - R, by); ctx.ellipse(cx, by, R, ry, 0, Math.PI, 0, true); ctx.lineTo(cx, top); }
      else { ctx.moveTo(cx - R, top); ctx.lineTo(cx - R, by); ctx.ellipse(cx, by, R, ry, 0, Math.PI, 0, true); ctx.lineTo(cx + R, top); ctx.ellipse(cx, top, R, ry, 0, 0, Math.PI, true); }
      ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(cx, cone ? by : top, R, ry, 0, 0, 7); if (!cone) { ctx.fill(); } ctx.stroke(); if (cone) { ctx.beginPath(); ctx.ellipse(cx, by, R, ry, 0, 0, Math.PI); ctx.stroke(); }
      TP.line(ctx, cx, by, cx + R, by, '#f59e0b', 2, [4, 3]); TP.line(ctx, cx, top + (cone ? 0 : 0), cx, by, '#f472b6', 2, [4, 3]); TP.tx(ctx, `r = ${N(r)}`, cx + R / 2, by + 16, '#f59e0b'); TP.tx(ctx, `h = ${N(h)}`, cx + 6, (top + by) / 2, '#f472b6', 'left'); };
    shape(130, false, '#38bdf8'); shape(370, true, '#22c55e');
    TP.tx(ctx, `Cilindro: ${N(res.Vc)} cm³`, 130, 30, '#38bdf8'); TP.tx(ctx, `Cono: ${N(res.Vk)} cm³`, 370, 30, '#22c55e');
  },
  retos: [
    { text: 'Con <b>h = 6</b>, duplica el radio de 3 a <b>6</b>: ¿por cuánto se multiplica el volumen?', check: S => S.r === 6 && S.h === 6 },
    { text: 'Haz un cilindro de <b>casi 1 litro</b> (entre 950 y 1050 cm³).', check: (S, r) => r.Vc >= 950 && r.Vc <= 1050 },
    { text: 'Haz un cono de <b>más de 200 cm³</b> con radio de <b>4 cm o menos</b>.', check: (S, r) => r.Vk > 200 && S.r <= 4 }],
  info: [
    { cls: 'materials', title: '📘 LAS FÓRMULAS', html: '<p><b>Cilindro:</b> V = π r² h (área de la base × altura).</p><p><b>Cono:</b> V = ⅓ π r² h. Con la misma base y altura, <b>3 conos llenan 1 cilindro</b>.</p>' },
    { cls: 'explanation', title: '💡 ¿POR QUÉ ES IMPORTANTE?', html: '<p>Los ingenieros calculan cuánta agua cabe en un tanque o un silo, y cuánto material necesita un embudo o un cono.</p><div class="highlight"><b>Regla de oro:</b> el radio está al cuadrado: si duplicas r, el volumen se multiplica por 4; si duplicas h, solo por 2.</div>' }]
});
</script></body></html>

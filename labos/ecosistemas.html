<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/tp.css"><title>FUTURA — Ecosistemas</title></head><body><script src="/static/tp.js"></script><script>
const N = TP.num;
const NIV = [['🌱', 'Productores'], ['🐛', 'Consumidores 1°'], ['🐸', 'Consumidores 2°'], ['🦅', 'Consumidores 3°']];
TP.lab({
  icon: '🌿', title: 'Laboratorio: Flujo de energía en un ecosistema', alt: 'Barras de energía en cada nivel trófico',
  subtitle: 'Cambia la energía de los productores y la eficiencia de transferencia, y mira cuánta llega a cada nivel.',
  controls: [{ id: 'E', label: 'Energía de los productores', min: 1000, max: 100000, step: 1000, value: 20000, unit: ' kcal', dec: 0 }, { id: 'eff', label: 'Eficiencia de transferencia', min: 5, max: 20, step: 1, value: 10, unit: ' %', dec: 0 }],
  presets: [{ label: 'Regla del 10 % (10 000 kcal)', values: { E: 10000, eff: 10 } }, { label: 'Máxima energía', values: { E: 100000, eff: 10 } }],
  compute({ E, eff }) {
    const e = [E]; for (let i = 1; i < 4; i++) e.push(e[i - 1] * eff / 100);
    return { e, steps: [
      { t: 'PASO 1 : Productores (nivel 1)', html: 'Captan la energía del sol con la fotosíntesis.', r: `${N(e[0], 1)} kcal` },
      ...[1, 2, 3].map(i => ({ t: `PASO ${i + 1} : ${NIV[i][1]} (nivel ${i + 1})`, html: `${N(e[i - 1], 1)} × ${eff} % = ${N(e[i - 1], 1)} × ${N(eff / 100)}`, r: `${N(e[i], 1)} kcal` })),
      { t: 'PASO 5 : Energía que no llega al último nivel', html: `${N(e[0], 1)} − ${N(e[3], 1)}`, f: `${N(e[0] - e[3], 1)} kcal (${N((1 - e[3] / e[0]) * 100, 2)} %) se pierde como calor o en la vida del organismo`, cls: 'bad' }] };
  },
  draw(ctx, S, res, { W, H }) {
    ctx.fillStyle = 'rgba(10,14,39,.6)'; ctx.fillRect(0, 0, W, H);
    res.e.forEach((v, i) => { const y = 24 + i * 92, w = Math.max(4, v / res.e[0] * 270);
      TP.tx(ctx, NIV[i][0] + ' ' + NIV[i][1], 12, y + 22, '#e8eaf6', 'left', 'bold 12px sans-serif');
      ctx.fillStyle = ['#22c55e', '#84cc16', '#eab308', '#f97316'][i]; ctx.fillRect(130, y, w, 34);
      TP.tx(ctx, `${N(v, 1)} kcal`, i === 0 ? 130 + w - 6 : 130 + w + 6, y + 22, i === 0 ? '#06231d' : '#e8eaf6', i === 0 ? 'right' : 'left');
      if (i < 3) TP.tx(ctx, `↓ se pierde ${N(v - res.e[i + 1], 1)} kcal como calor`, 130, y + 56, '#f59e0b', 'left', '11px sans-serif'); });
  },
  retos: [
    { text: 'Con <b>10 000 kcal</b> y <b>10 %</b>, mira cuánto recibe el consumidor primario (<b>1000 kcal</b>).', check: S => S.E === 10000 && S.eff === 10 },
    { text: 'Consigue que el <b>consumidor terciario</b> reciba al menos <b>100 kcal</b>.', check: (S, r) => r.e[3] >= 100 }],
  info: [
    { cls: 'materials', title: '📘 NIVELES TRÓFICOS', html: '<p><b>Productores:</b> hacen su alimento con la luz del sol.</p><p><b>Consumidores:</b> se alimentan de otros seres vivos (herbívoros, carnívoros).</p><p>Entre un nivel y el siguiente solo pasa cerca del <b>10 %</b> de la energía.</p>' },
    { cls: 'explanation', title: '💡 ¿POR QUÉ ES IMPORTANTE?', html: '<p>Por eso las cadenas alimentarias son cortas y hay muchos más herbívoros que depredadores en un ecosistema.</p><div class="highlight"><b>Regla de oro:</b> la energía no desaparece, se transforma: la mayor parte se libera como calor en cada nivel.</div>' }]
});
</script></body></html>

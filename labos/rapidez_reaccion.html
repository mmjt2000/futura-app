<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/tp.css"><title>FUTURA — Rapidez de reacción</title></head><body><script src="/static/tp.js"></script><script>
const N = TP.num, K0 = 0.03;
const kOf = ({ T, C, S }) => K0 * Math.pow(2, (T - 25) / 10) * C * S;
TP.lab({
  icon: '⏱️', title: 'Laboratorio: Rapidez de reacción', alt: 'Curva de producto formado en función del tiempo',
  subtitle: 'Temperatura, concentración y superficie de contacto cambian qué tan rápido ocurre una reacción. (Modelo simplificado)',
  controls: [{ id: 'T', label: '<b>Temperatura</b>', min: 5, max: 60, step: 5, value: 25, unit: ' °C', dec: 0 }, { id: 'C', label: '<b>Concentración</b> del reactivo', min: 0.5, max: 2, step: 0.5, value: 1, unit: ' M', dec: 1 }, { id: 'S', label: '<b>Superficie de contacto</b> (veces)', min: 1, max: 10, step: 1, value: 1, unit: ' ×', dec: 0 }],
  presets: [{ label: 'Referencia (25 °C, 1 M, trozo)', values: { T: 25, C: 1, S: 1 } }, { label: 'Pastilla en polvo', values: { T: 25, C: 1, S: 10 } }, { label: 'Agua caliente (45 °C)', values: { T: 45, C: 1, S: 1 } }, { label: 'Refrigerador (5 °C)', values: { T: 5, C: 1, S: 1 } }],
  compute(S) {
    const k = kOf(S), ft = Math.pow(2, (S.T - 25) / 10), t50 = Math.log(2) / k, t90 = Math.log(10) / k;
    return { k, t50, t90, steps: [
      { t: 'PASO 1 : Factor de temperatura', html: 'La rapidez se duplica cada +10 °C (regla aproximada).', f: `f(T) = 2^((${S.T} − 25)/10) = ${N(ft, 2)}` },
      { t: 'PASO 2 : Factor de concentración', html: 'A más concentración, más colisiones por segundo.', f: `f(C) = ${N(S.C, 1)}` },
      { t: 'PASO 3 : Factor de superficie', html: 'Un sólido en polvo expone más partículas que un trozo.', f: `f(S) = ${N(S.S, 0)}` },
      { t: 'PASO 4 : Constante de rapidez  k = k₀ · f(T) · f(C) · f(S)', html: `k = ${K0} × ${N(ft, 2)} × ${N(S.C, 1)} × ${N(S.S, 0)}`, r: `${N(k, 3)} s⁻¹`, cls: 'good' },
      { t: 'PASO 5 : Tiempos de la reacción', html: `Mitad de producto: t½ = ln 2 / k = ${N(t50, 1)} s`, r: `90 % en ${N(t90, 1)} s` },
      { t: 'PASO 6 : Comparación con la referencia', html: `k / k₀ = ${N(k / K0, 2)}`, f: k > K0 ? `${N(k / K0, 2)} veces más rápida` : k < K0 ? `${N(K0 / k, 2)} veces más lenta` : 'Igual que la referencia' }] };
  },
  draw(ctx, S, res, { W, H }) {
    const t90 = Math.max(res.t90, 1), st = TP.nice(t90 * 2, 5), x1 = Math.ceil(t90 * 2 / st) * st;
    const g = TP.plane(ctx, W, H, { x0: 0, x1, y0: 0, y1: 100, xt: st, yt: 20, lm: 44, xl: 'tiempo (s)', yl: 'producto (%)', yf: v => v + '%' });
    const curve = (k, col, dash) => { ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.setLineDash(dash || []); ctx.beginPath(); for (let i = 0; i <= 200; i++) { const t = x1 * i / 200, y = 100 * (1 - Math.exp(-k * t)); i ? ctx.lineTo(g.X(t), g.Y(y)) : ctx.moveTo(g.X(t), g.Y(y)); } ctx.stroke(); ctx.setLineDash([]); };
    curve(K0, '#94a3b8', [6, 5]); curve(res.k, '#4de0c1');
    if (res.t90 <= x1) { TP.line(ctx, g.X(res.t90), g.Y(0), g.X(res.t90), g.Y(90), 'rgba(245,158,11,.6)', 1.5, [4, 4]); TP.dot(ctx, g.X(res.t90), g.Y(90), 6, '#f59e0b'); TP.tx(ctx, `90 % en ${N(res.t90, 1)} s`, g.X(res.t90) + 8, g.Y(90) + 18, '#f59e0b', res.t90 > x1 * 0.6 ? 'right' : 'left'); }
    TP.tx(ctx, '--- referencia', g.r - 4, g.t + 14, '#94a3b8', 'right', '11px sans-serif'); TP.tx(ctx, '— tu reacción', g.r - 4, g.t + 30, '#4de0c1', 'right', '11px sans-serif');
  },
  retos: [
    { text: 'Consigue que la reacción llegue al <b>90 % en menos de 10 s</b>.', check: (S, r) => r.t90 < 10 },
    { text: 'Haz una reacción <b>más lenta</b> que la de referencia.', check: (S, r) => r.k < K0 - 1e-12 },
    { text: 'Sube la temperatura <b>10 °C</b> sin cambiar nada más: ¿por cuánto se multiplica k? (35 °C).', check: S => S.T === 35 && S.C === 1 && S.S === 1 }],
  info: [
    { cls: 'materials', title: '📘 TEORÍA DE COLISIONES', html: '<p>Para reaccionar, las partículas deben <b>chocar</b> con suficiente energía.</p><p>Más temperatura → chocan más fuerte y más seguido. Más concentración o más superficie → más choques por segundo.</p>' },
    { cls: 'explanation', title: '💡 ¿POR QUÉ ES IMPORTANTE?', html: '<p>La olla de presión cocina más rápido por la temperatura; el refrigerador retrasa la descomposición de los alimentos; un antiácido en polvo actúa antes que una pastilla entera.</p><div class="highlight"><b>Regla de oro:</b> enfriar no detiene una reacción, solo la hace más lenta.</div>' }]
});
</script></body></html>
